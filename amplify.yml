version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install -g pnpm@12.18.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    # IMPORTANT - Please verify your build output directory
    baseDirectory: '.output/'
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
